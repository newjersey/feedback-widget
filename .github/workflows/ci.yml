name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  biome:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Checks formatting, lint rules, and import sorting without writing changes.
      - name: Run Biome
        run: npx biome ci . --reporter=github

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  pa11y:
    name: Accessibility (pa11y)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: Allow Chrome sandbox (unprivileged user namespaces)
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns

      # pa11y-ci is kept out of devDependencies to avoid pulling Puppeteer into
      # local installs, so the version is pinned here instead. npm 12+ blocks
      # dependency install scripts by default; Puppeteer needs its postinstall
      # to download Chrome.
      - name: Run accessibility tests
        run: npx --yes --allow-scripts=puppeteer pa11y-ci@5.0.0
